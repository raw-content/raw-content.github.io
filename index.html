<!DOCTYPE html>
<html lang="en">
<head>
<link rel="schema.dcterms" href="http://purl.org/dc/terms/">
<meta name="dcterms.rights" content="CC-BY-4.0">
<meta name="dcterms.rightsHolder" content="https://github.com/casperdcl">
<meta name="dcterms.dateCopyrighted" content="2026">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>raw-content</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <div id="repo-header" class="repo-header"></div>
  <div id="toolbar" class="toolbar">
    <div class="branch-selector">
      <button id="branch-btn" class="branch-btn" type="button">
        <svg width="16" height="16"><use href="icons.svg#icon-branch"></use></svg>
        <span id="branch-name"></span>
        <svg width="16" height="16"><use href="icons.svg#icon-chevron"></use></svg>
      </button>
      <div id="branch-dropdown" class="branch-dropdown">
        <div class="dropdown-header">Switch branches</div>
        <div id="branch-list" class="dropdown-list"></div>
      </div>
    </div>
    <nav id="path-crumb" class="path-crumb"></nav>
  </div>
  <div id="listing" class="listing">
    <div class="state"><div class="spinner"></div></div>
  </div>
</div>
<script>
var ICON_DIR = '<svg width="16" height="16"><use href="icons.svg#icon-dir"></use></svg>';
var ICON_FILE = '<svg width="16" height="16"><use href="icons.svg#icon-file"></use></svg>';
var ICON_CHECK = '<svg width="16" height="16"><use href="icons.svg#icon-check"></use></svg>';

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

var segments = window.location.search.substring(1).split('/').filter(Boolean);
var owner = segments[0];
var repo = segments[1];
var branch = segments[2];
var pathParts = segments.slice(3);

var listing = document.getElementById('listing');

if (!owner || !repo || !branch) {
  document.querySelector('.container').innerHTML = '<div class="hint"><h1>raw-content</h1>'
    + '<p>Browse the raw contents of any GitHub repository.</p>'
    + '<p><code>' + esc(window.location.host) + '?OWNER/REPO/BRANCH/path</code></p></div>';
  throw new Error('Invalid URL format');
}

/* Repo header */
document.getElementById('repo-header').innerHTML =
  '<a href="https://github.com/' + esc(owner) + '">' + esc(owner) + '</a>'
  + '<span class="sep">/</span>'
  + '<a href="https://github.com/' + esc(owner) + '/' + esc(repo) + '" class="repo">' + esc(repo) + '</a>';

/* Branch button */
document.getElementById('branch-name').textContent = branch;

/* Path breadcrumb */
var base = window.location.pathname + '?' + esc(owner) + '/' + esc(repo) + '/' + esc(branch);
if (pathParts.length > 0) {
  var parts = [];
  for (var i = 0; i < pathParts.length; i++) {
    if (i === pathParts.length - 1) {
      parts.push('<span class="cur">' + esc(pathParts[i]) + '</span>');
    } else {
      var segHref = base + '/' + pathParts.slice(0, i + 1).map(esc).join('/');
      parts.push('<a href="' + segHref + '">' + esc(pathParts[i]) + '</a>');
    }
  }
  document.getElementById('path-crumb').innerHTML =
    '<span class="sep">/</span>' + parts.join('<span class="sep">/</span>');
}

document.title = (pathParts.join('/') || '/') + ' \u00b7 ' + owner + '/' + repo;

/* Branch dropdown */
var branchBtn = document.getElementById('branch-btn');
var branchDropdown = document.getElementById('branch-dropdown');
var branchList = document.getElementById('branch-list');
var branchesLoaded = false;

function checkResponse(r) {
  if (!r.ok) {
    if (r.status === 404) throw new Error('Not found \u2014 check that the repository, branch, and path exist');
    if (r.status === 403) throw new Error('API rate limit exceeded \u2014 try again later');
    throw new Error('HTTP ' + r.status + ' ' + r.statusText);
  }
  return r.json();
}

branchBtn.addEventListener('click', function(e) {
  e.stopPropagation();
  branchDropdown.classList.toggle('open');
  if (!branchesLoaded) {
    branchList.innerHTML = '<div class="dropdown-loading">Loading\u2026</div>';
    fetch('https://api.github.com/repos/' + owner + '/' + repo + '/branches?per_page=100')
      .then(checkResponse)
      .then(function(branches) {
        branchesLoaded = true;
        branchList.innerHTML = branches.map(function(b) {
          var isActive = b.name === branch;
          return '<a class="dropdown-item' + (isActive ? ' active' : '') + '" data-branch="' + esc(b.name) + '" href="#">'
            + '<span class="check">' + (isActive ? ICON_CHECK : '') + '</span>'
            + '<span class="branch-name">' + esc(b.name) + '</span></a>';
        }).join('');
      })
      .catch(function(err) {
        branchList.innerHTML = '<div class="dropdown-loading">' + esc(err.message) + '</div>';
      });
  }
});

/* Resolve the deepest valid prefix of targetPath in a branch tree */
function resolveDeepest(tree, targetPath, resolved) {
  if (targetPath.length === 0) return Promise.resolve(resolved);
  var next = targetPath[0];
  var entry = tree.tree.find(function(x) { return x.path === next; });
  if (!entry) return Promise.resolve(resolved);
  if (entry.type === 'blob') return Promise.resolve(resolved.concat(next));
  return fetch(entry.url).then(checkResponse).then(function(sub) {
    return resolveDeepest(sub, targetPath.slice(1), resolved.concat(next));
  }).catch(function() { return resolved; });
}

/* Switch branch: validate path, fall back to deepest valid prefix */
function switchBranch(newBranch) {
  branchDropdown.classList.remove('open');
  if (newBranch === branch && pathParts.length === 0) return;
  var newBase = window.location.pathname + '?' + owner + '/' + repo + '/' + newBranch;
  if (pathParts.length === 0 || newBranch === branch) {
    window.location.href = newBase + (pathParts.length ? '/' + pathParts.join('/') : '');
    return;
  }
  listing.innerHTML = '<div class="state"><div class="spinner"></div></div>';
  fetch('https://api.github.com/repos/' + owner + '/' + repo + '/git/trees/' + encodeURIComponent(newBranch))
    .then(checkResponse)
    .then(function(tree) { return resolveDeepest(tree, pathParts.slice(), []); })
    .then(function(valid) {
      window.location.href = newBase + (valid.length ? '/' + valid.join('/') : '');
    })
    .catch(function() { window.location.href = newBase; });
}

branchList.addEventListener('click', function(e) {
  var item = e.target.closest('.dropdown-item');
  if (!item) return;
  e.preventDefault();
  switchBranch(item.getAttribute('data-branch'));
});

branchDropdown.addEventListener('click', function(e) { e.stopPropagation(); });
document.addEventListener('click', function() { branchDropdown.classList.remove('open'); });

/* API */
function showError(msg) {
  listing.innerHTML = '<div class="state error">' + esc(msg) + '</div>';
}

var IMAGE_EXT = /\.(png|jpe?g|gif|svg|webp|ico|bmp)$/i;
var BINARY_EXT = /\.(zip|tar|gz|bz2|xz|7z|rar|pdf|exe|dll|so|dylib|wasm|class|o|bin|dat|db|sqlite|mp[34]|avi|mov|mkv|flac|wav|ogg|ttf|otf|woff2?)$/i;

function rawUrl(filePath) {
  return 'https://raw.githubusercontent.com/' + owner + '/' + repo + '/refs/heads/' + branch + '/' + filePath;
}

function formatBytes(b) {
  if (b < 1024) return b + ' bytes';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  return (b / 1048576).toFixed(1) + ' MB';
}

function showFile() {
  var fileName = pathParts[pathParts.length - 1];
  var url = rawUrl(pathParts.join('/'));

  var header = '<div class="file-header">'
    + '<span class="file-info" id="file-info"></span>'
    + '<span class="file-actions"><a href="' + esc(url) + '">Raw</a></span>'
    + '</div>';

  if (IMAGE_EXT.test(fileName)) {
    listing.innerHTML = header
      + '<div class="file-content image"><img src="' + esc(url) + '" alt="' + esc(fileName) + '"></div>';
    return;
  }

  if (BINARY_EXT.test(fileName)) {
    listing.innerHTML = header
      + '<div class="file-binary">Binary file not shown. <a href="' + esc(url) + '">Download</a></div>';
    return;
  }

  listing.innerHTML = header
    + '<div class="file-content"><pre class="line-nums" id="file-nums"></pre>'
    + '<pre class="line-code" id="file-code">Loading\u2026</pre></div>';

  fetch(url)
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function(text) {
      document.getElementById('file-code').textContent = text;
      var lines = text.split('\n');
      var lineCount = text.endsWith('\n') ? lines.length - 1 : lines.length;
      var nums = [];
      for (var n = 1; n <= lineCount; n++) nums.push(n);
      document.getElementById('file-nums').textContent = nums.join('\n');
      var bytes = new Blob([text]).size;
      document.getElementById('file-info').textContent = lineCount + ' lines \u00b7 ' + formatBytes(bytes);
    })
    .catch(function(e) {
      document.getElementById('file-code').textContent = 'Error loading file: ' + e.message;
    });
}

function traverse(tree, path) {
  if (path.length === 0) return tree;
  var next = path.shift();
  var entry = tree.tree.find(function(x) { return x.path === next; });
  if (!entry) throw new Error('Path not found: ' + next);
  if (entry.type === 'blob') return { _isBlob: true };
  return fetch(entry.url).then(checkResponse).then(function(sub) { return traverse(sub, path); });
}

fetch('https://api.github.com/repos/' + owner + '/' + repo + '/git/trees/' + branch)
  .then(checkResponse)
  .then(function(tree) { return traverse(tree, pathParts.slice()); })
  .then(function(result) {
    if (!result) return;
    if (result._isBlob) { showFile(); return; }
    var rows = [];

    if (pathParts.length > 0) {
      var upHref = pathParts.length > 1
        ? base + '/' + pathParts.slice(0, -1).map(esc).join('/')
        : base;
      rows.push('<a class="row dir" href="' + upHref + '">' + ICON_DIR + '<span class="name">..</span></a>');
    }

    var sorted = result.tree.slice().sort(function(a, b) {
      if (a.type === 'tree' && b.type !== 'tree') return -1;
      if (a.type !== 'tree' && b.type === 'tree') return 1;
      return a.path.localeCompare(b.path);
    });

    sorted.forEach(function(x) {
      var isDir = x.type === 'tree';
      var href = base + '/' + pathParts.concat(x.path).map(esc).join('/');
      rows.push(
        '<a class="row' + (isDir ? ' dir' : '') + '" href="' + href + '">'
        + (isDir ? ICON_DIR : ICON_FILE)
        + '<span class="name">' + esc(x.path) + '</span></a>'
      );
    });

    listing.innerHTML = rows.length ? rows.join('') : '<div class="state">Empty directory</div>';
  })
  .catch(function(e) { showError(e.message); });
</script>
</body>
</html>
